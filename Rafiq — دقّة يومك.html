<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<title>Rafiq — دقّة يومك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060706;
    --bg-2:#0A0C0A;
    --surface: rgba(255,255,255,0.045);
    --surface-solid:#121412;
    --surface-alt: rgba(255,255,255,0.03);
    --text:#F1F5F1;
    --text-soft:#A6AFA6;
    --text-faint:#666E66;
    --border: rgba(255,255,255,0.09);
    --brand:#22C55E;
    --brand-2:#16A34A;
    --brand-grad: linear-gradient(135deg,#4ADE80 0%,#16A34A 100%);
    --brand-soft: rgba(34,197,94,0.14);
    --brand-glow: rgba(34,197,94,0.45);
    --urgent:#FF5C72; --urgent-soft: rgba(255,92,114,0.14);
    --important:#FFB84D; --important-soft: rgba(255,184,77,0.14);
    --extra:#38BDF8; --extra-soft: rgba(56,189,248,0.14);
    --gold:#E8B44C; --gold-soft: rgba(232,180,76,0.14); --gold-glow: rgba(232,180,76,0.4);
    --ring-track: rgba(255,255,255,0.07);
    --shadow: 0 20px 50px -20px rgba(0,0,0,0.6);
    --shadow-sm: 0 8px 22px -12px rgba(0,0,0,0.55);
    --font-display:'Space Grotesk','IBM Plex Sans Arabic', sans-serif;
    --font:'IBM Plex Sans Arabic','Space Grotesk', sans-serif;
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 12px;
  }
  :root[data-theme="light"]{
    --bg:#F6F9F6; --bg-2:#EFF5EF;
    --surface:#FFFFFF; --surface-solid:#FFFFFF; --surface-alt:#EFF5EF;
    --text:#101410; --text-soft:#5B6459; --text-faint:#98A398;
    --border: rgba(10,20,10,0.09);
    --brand:#16A34A; --brand-2:#15803D;
    --brand-grad: linear-gradient(135deg,#22C55E 0%,#15803D 100%);
    --brand-soft: rgba(22,163,74,0.10); --brand-glow: rgba(22,163,74,0.25);
    --urgent:#E23F3F; --urgent-soft:#FDE8E8;
    --important:#DB9A17; --important-soft:#FCF1D8;
    --extra:#0284C7; --extra-soft:#E0F2FE;
    --gold:#B8860B; --gold-soft:#FBF0D9; --gold-glow: rgba(184,134,11,0.25);
    --ring-track: rgba(10,20,10,0.08);
    --shadow: 0 10px 30px -14px rgba(20,40,20,0.18);
    --shadow-sm: 0 4px 14px -8px rgba(20,40,20,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(34,197,94,0.14), transparent 60%),
      radial-gradient(700px 500px at 100% 0%, rgba(56,189,248,0.08), transparent 55%),
      var(--bg);
    font-family:var(--font); color:var(--text); -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .hidden{ display:none !important; }
  .app-shell{ display:flex; flex-direction:column; min-height:100vh; max-width:1200px; margin:0 auto; }
  .main-area{ display:flex; flex-direction:column; flex:1; order:1; min-width:0; }
  .content-scroll{ flex:1; overflow-y:auto; padding:18px 16px 90px; display:flex; flex-direction:column; }

  /* topbar */
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:16px 16px 4px; position:relative; }
  .topbar .who{ display:flex; align-items:center; gap:10px; }
  .avatar{ width:38px; height:38px; border-radius:50%; background:var(--brand-grad); display:flex; align-items:center; justify-content:center; color:#0A0D18; font-weight:700; font-size:15px; flex:0 0 auto; box-shadow:0 0 0 1px var(--border), 0 6px 18px -6px var(--brand-glow); border:none; cursor:pointer; padding:0; }
  .who .name{ font-family:var(--font-display); font-weight:700; font-size:15.5px; letter-spacing:.2px; }
  .who .sub{ font-size:12px; color:var(--text-faint); }
  .topbar-actions{ display:flex; align-items:center; gap:8px; }
  .lang-toggle{ appearance:none; border:1px solid var(--border); background:var(--surface); backdrop-filter: blur(14px); color:var(--text-soft); border-radius:999px; padding:8px 15px; font-family:var(--font); font-weight:600; font-size:12.5px; cursor:pointer; }
  .lang-toggle:hover{ border-color:var(--brand); color:var(--brand); }
  .icon-toggle{ appearance:none; border:1px solid var(--border); background:var(--surface); backdrop-filter: blur(14px); color:var(--text-soft); border-radius:999px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer; flex:0 0 auto; }
  .icon-toggle:hover{ border-color:var(--brand); color:var(--brand); }

  /* settings menu */
  .settings-menu{ position:absolute; top:60px; inset-inline-end:16px; background:var(--surface-solid); border:1px solid var(--border); border-radius:var(--radius-md); box-shadow:var(--shadow); padding:7px; display:none; flex-direction:column; min-width:190px; z-index:30; }
  .settings-menu.open{ display:flex; }
  .settings-item{ padding:10px 12px; border-radius:9px; font-size:13.5px; text-align:start; background:none; border:none; cursor:pointer; color:var(--text); display:flex; align-items:center; gap:9px; font-family:var(--font); }
  .settings-item:hover{ background:var(--surface-alt); }
  .settings-item.danger{ color:var(--urgent); }

  /* screens */
  .screen{ display:none; }
  .screen.active{ display:flex; flex-direction:column; gap:16px; }
  h1,h2,h3{ margin:0; }
  .page-title{ font-family:var(--font-display); font-size:30px; font-weight:700; line-height:1.2; letter-spacing:-0.3px;
    background: linear-gradient(90deg, var(--text) 30%, var(--brand-2) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .page-sub{ font-size:13px; color:var(--text-faint); margin-top:2px; font-weight:500; letter-spacing:.3px; }
  .section-label{ font-size:12.5px; font-weight:700; color:var(--text-soft); display:flex; align-items:center; gap:6px; text-transform:none; }

  /* hero */
  .hero{ position:relative; padding:26px 4px 6px; overflow:visible; animation: heroIn .7s cubic-bezier(.2,.8,.2,1); }
  .hero-glow{ position:absolute; inset-inline-start:-30px; top:-60px; width:230px; height:230px; border-radius:50%;
    background: radial-gradient(circle, var(--brand-glow) 0%, transparent 70%); filter: blur(10px); pointer-events:none; z-index:-1; }
  @keyframes heroIn{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }

  .ring-hero{ position:relative; width:172px; height:172px; margin:2px auto 8px; }
  .ring-svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring-track{ fill:none; stroke:var(--ring-track); stroke-width:11; }
  .ring-fill{ fill:none; stroke:var(--brand); stroke-width:11; stroke-linecap:round; stroke-dasharray:439.8; stroke-dashoffset:439.8; transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1); filter:drop-shadow(0 0 9px var(--brand-glow)); }
  .ring-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .ring-pct{ font-family:var(--font-display); font-size:36px; font-weight:700; letter-spacing:-0.5px; }
  .ring-label{ font-size:11.5px; color:var(--text-faint); text-align:center; padding:0 26px; line-height:1.5; }
  .info-modal-body{ font-size:13.5px; line-height:1.9; color:var(--text-soft); max-height:50vh; overflow-y:auto; text-align:start; }
  .info-modal-body p{ margin:0 0 12px; }
  .info-modal-body strong{ color:var(--text); }
  .pledge-sign{ margin-top:14px; padding-top:14px; border-top:1px dashed var(--border); font-family:var(--font-display); font-size:15px; color:var(--gold); text-align:center; }

  /* stat cards */
  .stat-row{ display:flex; gap:10px; overflow-x:auto; padding-bottom:2px; }
  .stat-card{ flex:1 0 118px; background:var(--surface); backdrop-filter: blur(18px); border-radius:var(--radius-md); padding:15px; box-shadow:var(--shadow-sm); border:1px solid var(--border); }
  .stat-card .ic{ width:30px; height:30px; border-radius:9px; background:var(--brand-soft); color:var(--brand); display:flex; align-items:center; justify-content:center; font-size:15px; margin-bottom:9px; }
  .stat-card .val{ font-family:var(--font-display); font-size:20px; font-weight:700; }
  .stat-card .lbl{ font-size:11px; color:var(--text-faint); margin-top:1px; }

  /* generic card */
  .card{ background:var(--surface); backdrop-filter: blur(18px); border-radius:var(--radius-lg); padding:17px; box-shadow:var(--shadow-sm); border:1px solid var(--border); }

  /* schedule timeline */
  .timeline{ display:flex; flex-direction:column; }
  .tl-row{ display:flex; align-items:center; gap:12px; padding:10px 0; position:relative; }
  .tl-dot{ width:9px; height:9px; border-radius:50%; background:var(--brand); flex:0 0 auto; box-shadow:0 0 0 4px var(--brand-soft), 0 0 10px var(--brand-glow); }
  .tl-row:not(:last-child):after{ content:""; position:absolute; inset-inline-start:4px; top:23px; bottom:-10px; width:1.5px; background:var(--border); }
  .tl-label{ font-size:14px; font-weight:600; flex:1; }
  .tl-time{ font-size:12.5px; color:var(--text-faint); font-variant-numeric:tabular-nums; font-family:var(--font-display); }

  /* priority badges/cards */
  .priority-list{ display:flex; flex-direction:column; gap:9px; }
  .priority-card{ display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:var(--radius-sm); background:var(--tier-soft, var(--brand-soft)); border:1px solid var(--border); }
  .badge{ font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:999px; color:#0A0D18; background:var(--tier-color, var(--brand)); flex:0 0 auto; }
  .priority-card .txt{ font-size:14px; font-weight:500; }

  .note-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px 16px; font-size:13.5px; color:var(--text-soft); line-height:1.7; }

  /* tasks */
  textarea.brain{ width:100%; min-height:88px; resize:vertical; background:var(--surface-alt); border:1px solid var(--border); border-radius:var(--radius-md); padding:12px 14px; font-family:var(--font); font-size:14px; color:var(--text); line-height:1.7; }
  textarea.brain::placeholder{ color:var(--text-faint); }
  .btn{ appearance:none; border:none; cursor:pointer; font-family:var(--font); font-size:14px; font-weight:700; border-radius:999px; padding:13px 22px; background:var(--brand-grad); color:#0A0D18; box-shadow:0 10px 26px -10px var(--brand-glow); width:100%; }
  .btn:disabled{ opacity:.55; cursor:default; box-shadow:none; }
  .btn.ghost{ background:none; color:var(--text-soft); border:1px solid var(--border); box-shadow:none; }
  .tier-group{ display:flex; flex-direction:column; gap:8px; }
  .tier-heading{ font-size:12px; font-weight:700; color:var(--text-soft); display:flex; align-items:center; gap:6px; }
  .task-row{ display:flex; align-items:flex-start; gap:10px; padding:12px 14px; border-radius:var(--radius-sm); background:var(--tier-soft); border:1px solid var(--border); }
  .task-row.done{ opacity:.5; }
  .task-row.done .task-text{ text-decoration:line-through; }
  .task-row input[type=checkbox]{ margin-top:3px; accent-color:var(--brand); width:16px; height:16px; }
  .task-text{ font-size:14px; font-weight:500; }
  .task-reason{ font-size:11.5px; color:var(--text-faint); margin-top:2px; }

  /* review */
  .mood-row{ display:flex; gap:8px; }
  .mood-btn{ flex:1; border:1px solid var(--border); background:var(--surface); border-radius:var(--radius-md); padding:12px 0; font-size:21px; cursor:pointer; }
  .mood-btn.active{ border-color:var(--brand); background:var(--brand-soft); box-shadow:0 0 0 1px var(--brand) inset; }
  .check-list{ display:flex; flex-direction:column; }
  .check-row{ display:flex; align-items:center; gap:10px; font-size:14px; padding:10px 0; border-bottom:1px solid var(--border); }
  .check-row:last-child{ border-bottom:none; }
  .check-row input{ accent-color:var(--brand); width:16px; height:16px; }
  .ai-card{ border-radius:var(--radius-md); padding:15px 16px; background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow-sm); }
  .ai-tag{ display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; color:#0A0D18; background:var(--brand-grad); padding:5px 10px; border-radius:999px; margin-bottom:10px; }
  .ai-text{ font-size:14px; line-height:1.8; }
  input.qinput{ width:100%; border:1px solid var(--border); background:var(--surface-alt); border-radius:var(--radius-sm); padding:11px 13px; font-family:var(--font); font-size:13.5px; color:var(--text); }

  /* goals */
  .goal-area-card{ display:flex; flex-direction:column; gap:13px; }
  .goal-area-card h3{ font-family:var(--font-display); font-size:15px; font-weight:700; }
  .goal-item{ display:flex; flex-direction:column; gap:7px; }
  .goal-item .row1{ display:flex; align-items:center; justify-content:space-between; }
  .goal-item .t{ font-size:13.5px; font-weight:500; }
  .goal-item .pct{ font-size:12px; color:var(--brand-2); font-weight:700; font-family:var(--font-display); }
  .progress-track{ height:7px; border-radius:999px; background:var(--surface-alt); overflow:hidden; }
  .progress-fill{ height:100%; border-radius:999px; background:var(--brand-grad); box-shadow:0 0 10px var(--brand-glow); }
  .goal-item .actions{ display:flex; justify-content:flex-end; }
  .add-btn{ width:23px; height:23px; border-radius:50%; border:1px solid var(--border); background:var(--surface-alt); color:var(--text-soft); font-size:13px; cursor:pointer; line-height:1; }

  /* coach */
  #screen-coach.active{ height:100%; }
  .chat{ flex:1; display:flex; flex-direction:column; gap:10px; }
  .bubble-row{ display:flex; align-items:flex-end; gap:8px; }
  .bubble-row.me{ flex-direction:row-reverse; }
  .mini-avatar{ width:26px; height:26px; border-radius:50%; background:var(--brand-grad); flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:12px; color:#0A0D18; }
  .bubble{ max-width:78%; padding:11px 15px; border-radius:16px; font-size:13.5px; line-height:1.7; }
  .bubble.coach{ background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow-sm); border-bottom-right-radius:4px; }
  .bubble.me{ background:var(--brand-grad); color:#0A0D18; font-weight:500; border-bottom-left-radius:4px; }
  .chat-input-row{ display:flex; gap:8px; padding-top:10px; position:sticky; bottom:0; background:linear-gradient(180deg, transparent, var(--bg) 30%); }
  .chat-input-row input{ flex:1; border:1px solid var(--border); background:var(--surface-solid); border-radius:999px; padding:13px 18px; font-family:var(--font); font-size:13.5px; color:var(--text); }
  .chat-input-row button{ width:44px; height:44px; border-radius:50%; border:none; background:var(--brand-grad); color:#0A0D18; font-size:16px; cursor:pointer; flex:0 0 auto; box-shadow:0 8px 20px -8px var(--brand-glow); }

  /* nav */
  .tabbar{ order:2; display:flex; border-top:1px solid var(--border); background:var(--surface-solid); padding:8px 8px calc(8px + env(safe-area-inset-bottom)); position:sticky; bottom:0; z-index:5; }
  .tab-btn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; cursor:pointer; padding:7px 2px; color:var(--text-faint); font-family:var(--font); font-size:10.5px; font-weight:600; border-radius:14px; transition:color .15s, background .15s; }
  .tab-btn svg{ width:20px; height:20px; }
  .tab-btn.active{ color:var(--brand); background:var(--brand-soft); }

  @media (min-width:900px){
    .app-shell{ flex-direction:row; padding:24px 20px; gap:20px; }
    .tabbar{ order:0; flex-direction:column; width:220px; flex:0 0 220px; height:fit-content; position:sticky; top:24px; border-top:none; border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px 10px; box-shadow:var(--shadow-sm); gap:2px; backdrop-filter: blur(18px); }
    .tab-btn{ flex-direction:row; justify-content:flex-start; gap:10px; padding:11px 12px; font-size:13.5px; }
    .tab-btn.active{ background:var(--brand-soft); }
    .main-area{ order:1; }
    .content-scroll{ padding-bottom:24px; }
  }

  /* ===== overlay screens: auth + onboarding ===== */
  .overlay-screen{ position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; padding:24px;
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(34,197,94,0.14), transparent 60%),
      radial-gradient(700px 500px at 100% 0%, rgba(56,189,248,0.08), transparent 55%),
      var(--bg);
    overflow-y:auto; }
  .forgot-row{ display:flex; justify-content:flex-end; margin-top:-3px; }
  .auth-link{ color:var(--brand); font-size:12px; cursor:pointer; text-decoration:none; font-weight:600; }
  .auth-toggle-mode{ text-align:center; font-size:13px; margin:0; }
  .auth-toggle-mode .auth-link{ font-size:13px; }
  .auth-box{ width:100%; max-width:380px; display:flex; flex-direction:column; gap:14px; animation: heroIn .5s cubic-bezier(.2,.8,.2,1); }
  .auth-logo{ width:56px; height:56px; border-radius:18px; background:var(--brand-grad); display:flex; align-items:center; justify-content:center; font-size:26px; margin:0 auto 4px; box-shadow:0 10px 26px -10px var(--brand-glow); }
  .auth-title{ font-family:var(--font-display); font-size:23px; font-weight:700; text-align:center; }
  .auth-sub{ font-size:13px; color:var(--text-faint); text-align:center; margin-top:-8px; line-height:1.6; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:12.5px; font-weight:600; color:var(--text-soft); }
  .field input{ border:1px solid var(--border); background:var(--surface-alt); border-radius:var(--radius-sm); padding:12px 14px; font-family:var(--font); font-size:14px; color:var(--text); width:100%; }
  .field input:focus{ outline:none; border-color:var(--brand); }
  .auth-error{ font-size:12.5px; color:var(--urgent); min-height:16px; text-align:center; }
  .auth-switch{ text-align:center; font-size:12.5px; color:var(--text-faint); }
  .auth-switch a{ color:var(--brand); cursor:pointer; font-weight:600; text-decoration:none; }
  .auth-hint{ text-align:center; font-size:11.5px; color:var(--text-faint); line-height:1.6; }

  .onboard-progress{ display:flex; gap:6px; justify-content:center; margin-bottom:2px; }
  .onboard-dot{ width:6px; height:6px; border-radius:50%; background:var(--border); transition:.2s; }
  .onboard-dot.active{ background:var(--brand); width:20px; border-radius:999px; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .chip{ border:1px solid var(--border); background:var(--surface); border-radius:999px; padding:11px 17px; font-size:13.5px; cursor:pointer; color:var(--text); font-family:var(--font); }
  .chip.active{ border-color:var(--brand); background:var(--brand-soft); color:var(--brand); font-weight:700; }
  .onboard-nav{ display:flex; gap:10px; margin-top:4px; }
  .onboard-nav .btn{ flex:1; }
  .ob-step-in{ animation: heroIn .38s cubic-bezier(.2,.8,.2,1); display:flex; flex-direction:column; gap:14px; }

  /* ===== dynamic editable lists (goals/skills/habits/schedule) ===== */
  .mini-input{ border:1px solid var(--border); background:var(--surface-alt); border-radius:10px; padding:10px 12px; font-family:var(--font); font-size:13.5px; color:var(--text); width:100%; }
  .mini-input:focus{ outline:none; border-color:var(--brand); }
  .add-row{ display:flex; gap:8px; }
  .add-row .mini-input{ flex:1; }
  .add-row .add-go{ width:42px; height:42px; flex:0 0 auto; border-radius:12px; border:none; background:var(--brand-grad); color:#0A0D18; font-size:18px; font-weight:700; cursor:pointer; }
  .list-row{ display:flex; align-items:center; gap:10px; padding:11px 13px; border-radius:var(--radius-sm); background:var(--surface-alt); border:1px solid var(--border); font-size:13.5px; }
  .list-row .lr-text{ flex:1; }
  .list-row .lr-del{ background:none; border:none; color:var(--text-faint); font-size:16px; cursor:pointer; flex:0 0 auto; line-height:1; padding:2px 4px; }
  .list-row .lr-del:hover{ color:var(--urgent); }
  .list-row .lr-log{ background:var(--brand-soft); color:var(--brand); border:none; border-radius:999px; padding:6px 12px; font-size:11.5px; font-weight:700; cursor:pointer; flex:0 0 auto; font-family:var(--font); }
  .empty-hint{ font-size:12.5px; color:var(--text-faint); padding:4px 2px; }

  .skill-row{ display:flex; flex-direction:column; gap:9px; padding:13px; border-radius:var(--radius-sm); background:var(--surface-alt); border:1px solid var(--border); }
  .skill-row .sr-top{ display:flex; align-items:center; justify-content:space-between; }
  .skill-row .sr-name{ font-size:13.5px; font-weight:700; }
  .skill-row .sr-meta{ font-size:11.5px; color:var(--text-faint); }
  .skill-row .sr-bump{ background:var(--brand-grad); color:#0A0D18; border:none; border-radius:999px; width:26px; height:26px; font-size:14px; font-weight:700; cursor:pointer; flex:0 0 auto; }

  /* skills: mini progress ring */
  .skill-row-v2{ display:flex; align-items:center; gap:13px; padding:13px; border-radius:var(--radius-sm); background:var(--surface-alt); border:1px solid var(--border); }
  .mini-ring-wrap{ position:relative; width:48px; height:48px; flex:0 0 auto; }
  .mini-ring-svg{ transform:rotate(-90deg); }
  .mini-ring-track{ fill:none; stroke:var(--ring-track); }
  .mini-ring-fill{ fill:none; stroke:var(--brand); stroke-linecap:round; transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1); }
  .mini-ring-pct{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:11px; font-weight:700; }
  .skill-info{ flex:1; display:flex; flex-direction:column; gap:7px; min-width:0; }
  .sr-name{ font-size:13.5px; font-weight:700; }

  /* goals: session dot track */
  .goal-row-v2{ display:flex; flex-direction:column; gap:9px; padding:12px 13px; border-radius:var(--radius-sm); background:var(--surface-alt); border:1px solid var(--border); }
  .gr-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .gr-bottom{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .session-dots{ display:flex; gap:6px; align-items:center; }
  .s-dot{ width:11px; height:11px; border-radius:50%; background:var(--ring-track); flex:0 0 auto; }
  .s-dot.filled{ background:var(--brand-grad); box-shadow:0 0 6px var(--brand-glow); }
  .s-extra{ font-size:10.5px; color:var(--text-faint); font-weight:700; margin-inline-start:4px; }

  .habit-row{ display:flex; align-items:center; gap:10px; padding:11px 13px; border-radius:var(--radius-sm); background:var(--surface-alt); border:1px solid var(--border); }
  .habit-tag{ font-size:10px; font-weight:700; padding:3px 9px; border-radius:999px; flex:0 0 auto; }
  .habit-tag.build{ background:var(--extra-soft); color:var(--extra); }
  .habit-tag.quit{ background:var(--urgent-soft); color:var(--urgent); }
  .type-toggle{ display:flex; gap:6px; }
  .type-toggle button{ flex:1; border:1px solid var(--border); background:var(--surface); border-radius:10px; padding:9px 0; font-size:12.5px; font-weight:600; color:var(--text-soft); cursor:pointer; font-family:var(--font); }
  .type-toggle button.active{ border-color:var(--brand); background:var(--brand-soft); color:var(--brand); }

  /* habits: 7-day streak tracker */
  .habit-row-v2{ display:flex; flex-direction:column; gap:9px; padding:12px 13px; border-radius:var(--radius-sm); background:var(--surface-alt); border:1px solid var(--border); }
  .hr-top{ display:flex; align-items:center; gap:8px; }
  .streak-badge{ font-size:11px; font-weight:700; color:var(--gold); flex:0 0 auto; }
  .hr-bottom{ display:flex; justify-content:center; }
  .week-dots{ display:flex; gap:7px; }

  /* calendar */
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin:10px 0; }
  .cal-dow{ font-size:10px; color:var(--text-faint); text-align:center; font-weight:700; }
  .cal-day{ aspect-ratio:1; border-radius:9px; background:var(--surface-alt); border:1px solid var(--border); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12px; cursor:pointer; position:relative; }
  .cal-day.empty{ background:none; border:none; cursor:default; }
  .cal-day.today{ border-color:var(--brand); }
  .cal-day.has-items::after{ content:""; position:absolute; bottom:4px; width:4px; height:4px; border-radius:50%; background:var(--brand); }
  .cal-day.selected{ background:var(--brand-soft); border-color:var(--brand); }

  /* agenda cards */
  .agenda-card{ display:flex; align-items:center; gap:11px; padding:12px 13px; border-radius:var(--radius-sm); background:var(--surface-alt); border:1px solid var(--border); cursor:pointer; }
  .agenda-card .ac-date{ display:flex; flex-direction:column; align-items:center; justify-content:center; width:44px; flex:0 0 auto; background:var(--surface); border-radius:9px; padding:6px 0; }
  .agenda-card .ac-date .d{ font-family:var(--font-display); font-size:16px; font-weight:700; line-height:1; }
  .agenda-card .ac-date .m{ font-size:9.5px; color:var(--text-faint); }
  .agenda-card .ac-info{ flex:1; min-width:0; }
  .agenda-card .ac-title{ font-size:13.5px; font-weight:700; }
  .agenda-card .ac-meta{ font-size:11px; color:var(--text-faint); margin-top:2px; }
  .agenda-card.done .ac-title{ text-decoration:line-through; opacity:.55; }
  .agenda-card .ac-check{ width:20px; height:20px; accent-color:var(--brand); flex:0 0 auto; }
  .assignee-badge{ font-size:10px; font-weight:700; color:var(--brand); background:var(--brand-soft); padding:3px 9px; border-radius:999px; flex:0 0 auto; white-space:nowrap; }
  .member-row{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--radius-sm); background:var(--surface-alt); border:1px solid var(--border); }
  .member-avatar{ width:30px; height:30px; border-radius:50%; background:var(--brand-grad); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:#0A0D18; flex:0 0 auto; }
  .skill-tag{ font-size:10.5px; font-weight:700; color:var(--gold); background:var(--gold-soft); padding:3px 9px; border-radius:999px; }
  .neglect-badge{ font-size:10.5px; font-weight:700; color:var(--urgent); background:var(--urgent-soft); padding:3px 9px; border-radius:999px; }
  .skill-select{ border:1px solid var(--border); background:var(--surface-alt); border-radius:10px; padding:9px 10px; font-family:var(--font); font-size:12.5px; color:var(--text-soft); width:100%; margin-top:6px; }
  .prio-badge{ font-size:9.5px; font-weight:700; padding:3px 8px; border-radius:999px; flex:0 0 auto; }
  .prio-badge.low{ background:var(--extra-soft); color:var(--extra); }
  .prio-badge.medium{ background:var(--important-soft); color:var(--important); }
  .prio-badge.high{ background:var(--urgent-soft); color:var(--urgent); }
  .rec-badge{ font-size:10px; color:var(--gold); }
  .w-dot{ width:16px; height:16px; border-radius:50%; background:var(--ring-track); border:1.5px solid transparent; }
  .w-dot.filled{ background:var(--brand-grad); box-shadow:0 0 6px var(--brand-glow); }
  .w-dot.today{ border-color:var(--brand); }

  .subsection-title{ font-family:var(--font-display); font-size:15px; font-weight:700; margin:2px 0 2px; display:flex; align-items:center; justify-content:space-between; }
  .subsection-title span.count{ font-size:11px; font-weight:700; color:var(--text-faint); background:var(--surface-alt); padding:3px 8px; border-radius:999px; }

  .today-priorities-chips{ display:flex; flex-wrap:wrap; gap:7px; }
  .today-priorities-chips .chip-static{ background:var(--brand-soft); color:var(--brand); border:1px solid var(--border); border-radius:999px; padding:7px 13px; font-size:12.5px; font-weight:600; }
  .sched-del{ background:none; border:none; color:var(--text-faint); font-size:14px; cursor:pointer; flex:0 0 auto; }
  .ai-status-note{ background:var(--important-soft); color:var(--important); border:1px solid var(--border); border-radius:var(--radius-sm); padding:11px 14px; font-size:12.5px; line-height:1.7; }
  #authOtp{ text-align:center; font-family:var(--font-display); font-size:22px; letter-spacing:8px; font-weight:700; }
  .add-sched-row{ display:flex; gap:8px; margin-top:8px; }
  .add-sched-row input{ flex:1; }
  .add-sched-row input.add-sched-time{ flex:0 0 92px; width:92px; }
</style>
</head>
<body>

<!-- ===== ONBOARDING ===== -->
<!-- ===== AUTH (local, device-encrypted) ===== -->
<div class="overlay-screen" id="authScreen">
  <button class="lang-toggle" id="langToggleAuth" style="position:absolute; top:calc(16px + env(safe-area-inset-top,0px)); inset-inline-end:16px; z-index:2;">English</button>
  <div class="auth-box">
    <div class="auth-logo">🤝</div>
    <h1 class="auth-title" id="authTitle"></h1>
    <p class="auth-sub" id="authSub"></p>
    <div class="field">
      <input id="authIdentifier" type="text" inputmode="email" autocomplete="username">
    </div>
    <div class="field">
      <input id="authPassword" type="password" autocomplete="current-password">
      <div class="forgot-row"><a class="auth-link" id="forgotLink"></a></div>
    </div>
    <div class="field hidden" id="privacyField">
      <label class="check-row" style="font-size:12.5px; border-bottom:none; padding:0; align-items:flex-start;">
        <input type="checkbox" id="authPrivacyCheck" style="margin-top:2px;">
        <span id="authPrivacyLabel"></span> <a class="auth-link" id="authPrivacyLink"></a>
      </label>
    </div>
    <p class="auth-error" id="authError"></p>
    <button class="btn" id="authSubmit"></button>
    <p class="auth-toggle-mode"><a class="auth-link" id="modeToggleLink"></a></p>
    <p class="auth-hint" id="authHint"></p>
  </div>
</div>

<div class="overlay-screen hidden" id="onboardScreen">
  <button class="lang-toggle" id="langToggleOnboard" style="position:absolute; top:calc(16px + env(safe-area-inset-top,0px)); inset-inline-end:16px; z-index:2;">English</button>
  <div class="auth-box" id="onboardBox"></div>
</div>

<!-- ===== APP ===== -->
<div class="app-shell hidden" id="appShell">
  <nav class="tabbar" id="tabbar">
    <button class="tab-btn active" data-target="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2.5v3M16 2.5v3M3 9.5h18"/></svg>
      <span data-t="nav_today"></span>
    </button>
    <button class="tab-btn" data-target="tasks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6h11M9 12h11M9 18h7"/><path d="M4 6l1.3 1.3L7.5 5"/><path d="M4 12l1.3 1.3L7.5 11"/></svg>
      <span data-t="nav_tasks"></span>
    </button>
    <button class="tab-btn" data-target="review">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 13.5A8 8 0 1 1 10.5 4a6.4 6.4 0 0 0 9.5 9.5z"/></svg>
      <span data-t="nav_review"></span>
    </button>
    <button class="tab-btn" data-target="goals">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.7" fill="currentColor"/></svg>
      <span data-t="nav_goals"></span>
    </button>
    <button class="tab-btn" data-target="agenda">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><circle cx="8.2" cy="14" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="14" r="1.1" fill="currentColor" stroke="none"/><circle cx="8.2" cy="17.3" r="1.1" fill="currentColor" stroke="none"/></svg>
      <span data-t="nav_agenda"></span>
    </button>
    <button class="tab-btn" data-target="coach">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v10H9l-4 4V5z"/><circle cx="9" cy="10" r="0.8" fill="currentColor"/><circle cx="12.5" cy="10" r="0.8" fill="currentColor"/><circle cx="16" cy="10" r="0.8" fill="currentColor"/></svg>
      <span data-t="nav_coach"></span>
    </button>
  </nav>

  <div class="main-area">
    <header class="topbar">
      <div class="who">
        <button class="avatar" id="avatarBtn">R</button>
        <div><div class="name" id="topName">Rafiq</div><div class="sub" data-t="tagline"></div></div>
      </div>
      <div class="topbar-actions">
        <button class="icon-toggle" id="themeToggle">🌙</button>
        <button class="lang-toggle" id="langToggle">English</button>
      </div>
      <div class="settings-menu" id="settingsMenu">
        <button class="settings-item" id="menuChangeName">✏️ <span data-t="settings_change_name"></span></button>
        <button class="settings-item" id="menuPrivacy">🔒 <span data-t="settings_privacy"></span></button>
        <button class="settings-item" id="menuPledge">🤝 <span data-t="settings_pledge"></span></button>
        <button class="settings-item" id="menuFamily">👪 <span data-t="settings_family"></span></button>
        <button class="settings-item" id="menuLogout">↩️ <span data-t="settings_logout"></span></button>
        <button class="settings-item danger" id="menuDelete">🗑️ <span data-t="settings_delete"></span></button>
      </div>
    </header>

    <div class="overlay-screen hidden" id="infoModal">
      <div class="auth-box">
        <div class="auth-logo" id="infoModalIcon">🔒</div>
        <h1 class="auth-title" id="infoModalTitle"></h1>
        <div class="info-modal-body" id="infoModalBody"></div>
        <button class="btn" id="infoModalClose" data-t="modal_close"></button>
      </div>
    </div>

    <div class="overlay-screen hidden" id="agendaFormModal">
      <div class="auth-box" style="max-width:420px;">
        <div class="auth-logo" id="agendaFormIcon">📅</div>
        <h1 class="auth-title" id="agendaFormTitle"></h1>
        <div class="field"><input class="mini-input" id="agTitle"></div>
        <div class="field"><input class="mini-input" id="agDesc"></div>
        <div class="field-row" style="display:flex; gap:8px;">
          <div class="field" style="flex:1;"><label id="agDateLabel"></label><input class="mini-input" id="agDate" type="date"></div>
          <div class="field" style="flex:1;"><label id="agTimeLabel"></label><input class="mini-input" id="agTime" type="time"></div>
        </div>
        <div class="field" id="agPriorityField">
          <label data-t="task_priority_label"></label>
          <div class="type-toggle" id="agPriorityToggle">
            <button type="button" data-p="low" data-t="priority_low"></button>
            <button type="button" class="active" data-p="medium" data-t="priority_medium"></button>
            <button type="button" data-p="high" data-t="priority_high"></button>
          </div>
        </div>
        <div class="field hidden" id="agSkillField">
          <label data-t="task_skill_label"></label>
          <select class="skill-select" id="agSkillSelect" style="margin-top:0;"></select>
        </div>
        <div class="field">
          <label id="agRecurringLabel"></label>
          <select class="mini-input" id="agRecurring">
            <option value="none" data-t="recurring_none"></option>
            <option value="daily" data-t="recurring_daily"></option>
            <option value="weekly" data-t="recurring_weekly"></option>
            <option value="monthly" data-t="recurring_monthly"></option>
            <option value="yearly" data-t="recurring_yearly"></option>
          </select>
        </div>
        <div class="field">
          <label id="agReminderLabel"></label>
          <select class="mini-input" id="agReminder">
            <option value="none" data-t="reminder_none"></option>
            <option value="0" data-t="reminder_0"></option>
            <option value="5" data-t="reminder_5"></option>
            <option value="15" data-t="reminder_15"></option>
            <option value="30" data-t="reminder_30"></option>
            <option value="60" data-t="reminder_60"></option>
            <option value="1440" data-t="reminder_1440"></option>
          </select>
        </div>
        <div class="field hidden" id="agAssignField">
          <label data-t="agenda_family_label"></label>
          <div class="chip-row" id="agAssignChips"></div>
        </div>
        <p class="auth-hint hidden" id="agFamilyHint" data-t="agenda_family_hint"></p>
        <p class="auth-error" id="agError"></p>
        <div class="onboard-nav">
          <button class="btn ghost" id="agCancelBtn" data-t="agenda_cancel"></button>
          <button class="btn" id="agSaveBtn" data-t="agenda_save"></button>
        </div>
        <button class="btn ghost hidden" id="agDeleteBtn" style="margin-top:8px; color:var(--urgent); border-color:var(--urgent);" data-t="agenda_delete"></button>
      </div>
    </div>

    <div class="overlay-screen hidden" id="familyModal">
      <div class="auth-box" style="max-width:420px;">
        <div class="auth-logo">👪</div>
        <h1 class="auth-title" data-t="family_title"></h1>
        <p class="auth-sub" id="familyIntro"></p>

        <div id="familyRoleChoice">
          <button class="btn" id="pickRoleAdmin" data-t="family_role_admin_btn"></button>
          <button class="btn ghost" id="pickRoleMember" style="margin-top:8px;" data-t="family_role_member_btn"></button>
        </div>

        <div id="familyAdminView" class="hidden">
          <div class="add-row">
            <input class="mini-input" id="newMemberName" data-t-ph="family_add_ph">
            <button class="add-go" id="addMemberBtn">+</button>
          </div>
          <div id="familyMembersList" style="display:flex;flex-direction:column;gap:8px;margin-top:10px;"></div>
          <p class="auth-hint" data-t="family_admin_hint"></p>
        </div>

        <div id="familyMemberView" class="hidden">
          <p class="auth-hint" data-t="family_member_hint"></p>
        </div>

        <button class="btn ghost" id="familyCloseBtn" style="margin-top:14px;" data-t="modal_close"></button>
      </div>
    </div>

    <div class="overlay-screen hidden" id="calendarModal">
      <div class="auth-box" style="max-width:420px;">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <button class="icon-toggle" id="calPrevBtn">‹</button>
          <h1 class="auth-title" id="calMonthLabel" style="font-size:16px;"></h1>
          <button class="icon-toggle" id="calNextBtn">›</button>
        </div>
        <div id="calGrid" class="cal-grid"></div>
        <div id="calDayAgenda" class="info-modal-body" style="max-height:30vh;"></div>
        <button class="btn ghost" id="calCloseBtn" data-t="calendar_close"></button>
      </div>
    </div>

    <div class="overlay-screen hidden" id="notifAskModal">
      <div class="auth-box">
        <div class="auth-logo">🔔</div>
        <h1 class="auth-title" data-t="notif_ask_title"></h1>
        <p class="auth-sub" data-t="notif_ask_body" style="text-align:start;"></p>
        <button class="btn" id="notifAllowBtn" data-t="notif_ask_allow"></button>
        <button class="btn ghost" id="notifLaterBtn" data-t="notif_ask_later"></button>
      </div>
    </div>

    <div class="content-scroll">
      <!-- TODAY -->
      <section class="screen active" data-screen="today" id="screen-today">
        <div class="hero">
          <span class="hero-glow" aria-hidden="true"></span>
          <p class="page-sub" id="dateSub"></p>
          <h1 class="page-title" id="greetingText"></h1>
        </div>

        <div class="ring-hero" id="ringHero">
          <svg viewBox="0 0 160 160" class="ring-svg">
            <circle class="ring-track" cx="80" cy="80" r="70"></circle>
            <circle class="ring-fill" id="ringFill" cx="80" cy="80" r="70"></circle>
          </svg>
          <div class="ring-center">
            <div class="ring-pct" id="ringPct">0%</div>
            <div class="ring-label" id="ringLabel"></div>
          </div>
        </div>

        <div class="stat-row" id="statRow"></div>

        <div class="today-priorities-chips" id="lifePrioritiesChips"></div>

        <div class="card">
          <div class="section-label" data-t="today_schedule_title" style="margin-bottom:10px;"></div>
          <div class="timeline" id="scheduleList"></div>
          <div class="add-sched-row">
            <input class="mini-input" id="newSchedLabel">
            <input class="mini-input add-sched-time" id="newSchedTime" type="time">
            <button class="add-go" id="addSchedBtn">+</button>
          </div>
        </div>

        <div>
          <div class="section-label" data-t="today_priorities_title" style="margin-bottom:10px;"></div>
          <div class="priority-list" id="todayPriorities"></div>
        </div>

        <div class="card" id="todayAgendaCard">
          <div class="section-label" data-t="today_agenda_card_title" style="margin-bottom:10px;"></div>
          <div id="todayAgendaBody" style="display:flex; flex-direction:column; gap:8px;"></div>
        </div>

        <div class="ai-status-note hidden" id="neglectNudge"></div>

        <div class="note-card" id="noteCard"></div>
      </section>

      <!-- TASKS -->
      <section class="screen" data-screen="tasks" id="screen-tasks">
        <div>
          <h1 class="page-title" data-t="tasks_title"></h1>
          <p class="page-sub" data-t="tasks_subtitle"></p>
        </div>
        <textarea class="brain" id="brainDump"></textarea>
        <button class="btn" id="sortBtn" data-t="tasks_sort_btn"></button>
        <div id="tasksOutput" style="display:flex;flex-direction:column;gap:16px;"></div>
      </section>

      <!-- REVIEW -->
      <section class="screen" data-screen="review" id="screen-review">
        <div>
          <h1 class="page-title" data-t="review_title"></h1>
          <p class="page-sub" data-t="review_subtitle"></p>
        </div>
        <div class="mood-row" id="moodRow">
          <button class="mood-btn" data-mood="down">😞</button>
          <button class="mood-btn" data-mood="ok">😐</button>
          <button class="mood-btn" data-mood="good">🙂</button>
          <button class="mood-btn" data-mood="great">🔥</button>
        </div>
        <div class="card">
          <div class="section-label" data-t="review_checklist_title" style="margin-bottom:6px;"></div>
          <div class="check-list" id="reviewChecklist"></div>
        </div>
        <button class="btn" id="reflectBtn" data-t="review_reflect_btn"></button>
        <div class="ai-card" id="reflectionBox" style="display:none;">
          <span class="ai-tag">✨ <span data-t="review_ai_badge"></span></span>
          <div class="ai-text" id="reflectionText"></div>
        </div>
        <div id="reflectQuestionWrap" style="display:none;">
          <p class="section-label" data-t="review_question_title" style="margin-bottom:6px;"></p>
          <input class="qinput" id="reflectAnswer">
        </div>
      </section>

      <!-- GOALS -->

  /* ================= local encryption (AES-256-GCM, device-local key) ================= */
  var ENC_KEY_STORAGE = "rafiq_dek_v1";
  var deviceKeyPromise = null;
  function bytesToB64(bytes){ var bin=""; for(var i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]); return btoa(bin); }
  function b64ToBytes(b64){ var bin=atob(b64); var bytes=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return bytes; }
  function getOrCreateDeviceKey(){
    if(deviceKeyPromise) return deviceKeyPromise;
    deviceKeyPromise = (async function(){
      var raw = null;
      try{ raw = localStorage.getItem(ENC_KEY_STORAGE); }catch(e){}
      var keyBytes;
      if(raw){ keyBytes = b64ToBytes(raw); }
      else{
        keyBytes = crypto.getRandomValues(new Uint8Array(32));
        try{ localStorage.setItem(ENC_KEY_STORAGE, bytesToB64(keyBytes)); }catch(e){}
      }
      return crypto.subtle.importKey("raw", keyBytes, {name:"AES-GCM"}, false, ["encrypt","decrypt"]);
    })();
    return deviceKeyPromise;
  }
  async function encryptString(str){
    var key = await getOrCreateDeviceKey();
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var cipherBuf = await crypto.subtle.encrypt({name:"AES-GCM", iv:iv}, key, new TextEncoder().encode(str));
    var cipherBytes = new Uint8Array(cipherBuf);
    var combined = new Uint8Array(iv.length + cipherBytes.length);
    combined.set(iv,0); combined.set(cipherBytes, iv.length);
    return bytesToB64(combined);
  }
  async function decryptString(b64){
    var key = await getOrCreateDeviceKey();
    var bytes = b64ToBytes(b64);
    var iv = bytes.slice(0,12);
    var cipherBytes = bytes.slice(12);
    var plainBuf = await crypto.subtle.decrypt({name:"AES-GCM", iv:iv}, key, cipherBytes);
    return new TextDecoder().decode(plainBuf);
  }

  async function loadState(){
    var merged = JSON.parse(JSON.stringify(defaultState));
    try{
      var raw = STORE_KEY ? localStorage.getItem(STORE_KEY) : null;
      if(raw){
        var plain = await decryptString(raw);
        merged = Object.assign({}, merged, JSON.parse(plain));
      }
    }catch(e){ /* nothing saved yet, or unreadable — start fresh */ }
    merged.theme = getDeviceTheme();
    return merged;
  }
  var state = JSON.parse(JSON.stringify(defaultState));
  state.theme = getDeviceTheme();
  applyTheme();
  function saveState(){
    if(!STORE_KEY) return;
    encryptString(JSON.stringify(state)).then(function(cipher){
      try{ localStorage.setItem(STORE_KEY, cipher); }catch(e){}
    }).catch(function(){});
  }

  /* ================= password hashing + account registry (local, per-device) ================= */
  var ACCOUNTS_KEY = "rafiq_accounts_v1";
  var SESSION_KEY = "rafiq_session_v1";
  var ATTEMPTS_KEY = "rafiq_attempts_v1";
  function normId(v){ return v.trim().toLowerCase(); }
  async function sha256Hex(str){
    var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.prototype.map.call(new Uint8Array(buf), function(b){ return b.toString(16).padStart(2,"0"); }).join("");
  }
  function randomSaltHex(){
    var arr = crypto.getRandomValues(new Uint8Array(16));
    return Array.prototype.map.call(arr, function(b){ return b.toString(16).padStart(2,"0"); }).join("");
  }
  function getAccounts(){ try{ return JSON.parse(localStorage.getItem(ACCOUNTS_KEY)) || {}; }catch(e){ return {}; } }
  function saveAccounts(obj){ try{ localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(obj)); }catch(e){} }
  function getAccount(identifier){ return getAccounts()[normId(identifier)] || null; }
  function setAccount(identifier, data){ var all = getAccounts(); all[normId(identifier)] = data; saveAccounts(all); }
  function deleteAccount(identifier){ var all = getAccounts(); delete all[normId(identifier)]; saveAccounts(all); }
  function getSession(){ try{ return localStorage.getItem(SESSION_KEY); }catch(e){ return null; } }
  function setSession(identifier){ try{ localStorage.setItem(SESSION_KEY, normId(identifier)); }catch(e){} }
  function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }
  function getAttempts(identifier){ try{ var all = JSON.parse(localStorage.getItem(ATTEMPTS_KEY))||{}; return all[normId(identifier)] || {count:0, lockUntil:0}; }catch(e){ return {count:0, lockUntil:0}; } }
  function setAttempts(identifier, val){ try{ var all = JSON.parse(localStorage.getItem(ATTEMPTS_KEY))||{}; all[normId(identifier)] = val; localStorage.setItem(ATTEMPTS_KEY, JSON.stringify(all)); }catch(e){} }

  /* ================= agenda date/recurrence helpers ================= */
  function parseDateKey(dk){ var p=dk.split("-"); return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10)); }
  function toDateKeyD(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
  function occurrencesInRange(item, rangeStart, rangeEnd){
    var start = parseDateKey(item.date);
    var results = [];
    if(item.recurring==="none" || !item.recurring){
      if(start>=rangeStart && start<=rangeEnd) results.push(new Date(start));
      return results;
    }
    if(item.recurring==="daily"){
      var c = new Date(Math.max(start.getTime(), rangeStart.getTime()));
      while(c<=rangeEnd){ results.push(new Date(c)); c.setDate(c.getDate()+1); }
    } else if(item.recurring==="weekly"){
      var c2 = new Date(start);
      while(c2<rangeStart) c2.setDate(c2.getDate()+7);
      while(c2<=rangeEnd){ results.push(new Date(c2)); c2.setDate(c2.getDate()+7); }
    } else if(item.recurring==="monthly"){
      var c3 = new Date(start);
      while(c3<rangeStart) c3.setMonth(c3.getMonth()+1);
      while(c3<=rangeEnd){ results.push(new Date(c3)); c3.setMonth(c3.getMonth()+1); }
    } else if(item.recurring==="yearly"){
      var c4 = new Date(start);
      while(c4<rangeStart) c4.setFullYear(c4.getFullYear()+1);
      while(c4<=rangeEnd){ results.push(new Date(c4)); c4.setFullYear(c4.getFullYear()+1); }
    }
    return results;
  }
  function nextOccurrence(item){
    var today = new Date(); today.setHours(0,0,0,0);
    var farEnd = new Date(today); farEnd.setFullYear(farEnd.getFullYear()+2);
    var occ = occurrencesInRange(item, today, farEnd);
    return occ.length ? occ[0] : null;
  }
  function fmtDayLabel(d){
    var todayStr = toDateKeyD(new Date());
    var tmr = new Date(); tmr.setDate(tmr.getDate()+1);
    var dk = toDateKeyD(d);
    if(dk===todayStr) return lang==="ar" ? "اليوم" : "Today";
    if(dk===toDateKeyD(tmr)) return lang==="ar" ? "بكرة" : "Tomorrow";
    return d.toLocaleDateString(lang==="ar"?"ar-SA":"en-US", {day:"numeric", month:"short"});
  }
  function monthShort(d){ return d.toLocaleDateString(lang==="ar"?"ar-SA":"en-US", {month:"short"}); }

  function renderAgendaScreen(){
    var el = document.getElementById("apptsUpcomingList");
    if(!el) return; // screen not in DOM yet
    var appts = state.agenda.filter(function(i){return i.kind==="appt";});
    var tasksArr = state.agenda.filter(function(i){return i.kind==="task";});

    var upcoming=[], past=[];
    appts.forEach(function(i){
      var occ = nextOccurrence(i);
      if(occ) upcoming.push({item:i, occ:occ}); else past.push(i);
    });
    upcoming.sort(function(a,b){
      var ak=toDateKeyD(a.occ)+(a.item.time||""), bk=toDateKeyD(b.occ)+(b.item.time||"");
      return ak<bk?-1:(ak>bk?1:0);
    });
    document.getElementById("apptsUpcomingList").innerHTML = upcoming.length ? upcoming.map(function(x){return apptCardHtml(x.item,x.occ);}).join("") : '<p class="empty-hint">'+t("appt_empty")+'</p>';
    document.getElementById("apptsPastList").innerHTML = past.length ? past.map(function(i){return apptCardHtml(i, parseDateKey(i.date));}).join("") : '';

    var incomplete = tasksArr.filter(function(i){return !i.done;});
    var done = tasksArr.filter(function(i){return i.done;});
    incomplete.sort(function(a,b){
      var oa=nextOccurrence(a), ob=nextOccurrence(b);
      var ak=oa?toDateKeyD(oa):"9999-99-99", bk=ob?toDateKeyD(ob):"9999-99-99";
      return ak<bk?-1:(ak>bk?1:0);
    });
    document.getElementById("tasksIncompleteList").innerHTML = incomplete.length ? incomplete.map(taskCardHtml).join("") : '<p class="empty-hint">'+t("task_empty")+'</p>';
    document.getElementById("tasksDoneList").innerHTML = done.length ? done.map(taskCardHtml).join("") : '';

    wireAgendaCardClicks();

  function renderCalendar(){
    var y=calViewDate.getFullYear(), m=calViewDate.getMonth();
    document.getElementById("calMonthLabel").textContent = calViewDate.toLocaleDateString(lang==="ar"?"ar-SA":"en-US", {month:"long", year:"numeric"});
    var first = new Date(y,m,1), last = new Date(y,m+1,0);
    var startOffset = first.getDay();
    var dows = lang==="ar" ? ["أحد","اثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"] : ["Su","Mo","Tu","We","Th","Fr","Sa"];
    var html = dows.map(function(d){return '<div class="cal-dow">'+d+'</div>';}).join("");
    for(var i=0;i<startOffset;i++) html += '<div class="cal-day empty"></div>';
    var monthStart = new Date(y,m,1), monthEnd = new Date(y,m,last.getDate());
    var dayHasItems = {};
    state.agenda.forEach(function(item){
      occurrencesInRange(item, monthStart, monthEnd).forEach(function(occ){ dayHasItems[toDateKeyD(occ)] = true; });
    });
    var todayStr = todayKey();
    for(var d=1; d<=last.getDate(); d++){
      var dk = y+"-"+pad2(m+1)+"-"+pad2(d);
      var cls = "cal-day"+(dayHasItems[dk]?" has-items":"")+(dk===todayStr?" today":"");
      html += '<div class="'+cls+'" data-day="'+dk+'">'+d+'</div>';
    }
    document.getElementById("calGrid").innerHTML = html;
    document.getElementById("calGrid").querySelectorAll("[data-day]").forEach(function(cell){
      cell.addEventListener("click", function(){
        document.getElementById("calGrid").querySelectorAll(".cal-day").forEach(function(c){c.classList.remove("selected");});
        cell.classList.add("selected");
        showDayAgenda(cell.getAttribute("data-day"));
      });
    });
    if(y===new Date().getFullYear() && m===new Date().getMonth()){ showDayAgenda(todayStr); }
    else{ document.getElementById("calDayAgenda").innerHTML = ""; }
  }

  /* ================= today screen: agenda summary ================= */
  function renderTodayAgendaSummary(){
    var body = document.getElementById("todayAgendaBody");
    if(!body) return;
    var todayStr = todayKey();
    var appts = state.agenda.filter(function(i){return i.kind==="appt";});
    var tasksArr = state.agenda.filter(function(i){return i.kind==="task";});

    var withNext = appts.map(function(i){ return {item:i, occ:nextOccurrence(i)}; }).filter(function(x){return x.occ;});
    withNext.sort(function(a,b){
      var ak=toDateKeyD(a.occ)+(a.item.time||""), bk=toDateKeyD(b.occ)+(b.item.time||"");
      return ak<bk?-1:(ak>bk?1:0);
    });
    var nextAppt = withNext[0];

    var dueToday = tasksArr.filter(function(i){ var occ=nextOccurrence(i); return occ && toDateKeyD(occ)===todayStr && !i.done; });
    var incomplete = tasksArr.filter(function(i){ return !i.done; });

    var now = new Date();
    var remindersToday = state.agenda.filter(function(i){
      if(i.reminder==="none" || !i.time) return false;
      var occ = nextOccurrence(i); if(!occ || toDateKeyD(occ)!==todayStr) return false;
      var tp=i.time.split(":"); var dt=new Date(occ.getFullYear(),occ.getMonth(),occ.getDate(),parseInt(tp[0],10)||0,parseInt(tp[1],10)||0);
      var remindAt = new Date(dt.getTime() - (parseInt(i.reminder,10)||0)*60000);
      return remindAt>=now;
    });

    if(appts.length===0 && tasksArr.length===0){
      body.innerHTML = '<p class="empty-hint">'+t("today_agenda_empty")+'</p>';
      return;
    }
    var rows = [
      {ic:"📅", label:t("today_next_appt"), val: nextAppt ? (nextAppt.item.title+" · "+fmtDayLabel(nextAppt.occ)+(nextAppt.item.time?" "+nextAppt.item.time:"")) : "—"},
      {ic:"✅", label:t("today_due_today"), val: dueToday.length},
      {ic:"📋", label:t("today_incomplete_tasks"), val: incomplete.length},
      {ic:"⏰", label:t("today_upcoming_reminders"), val: remindersToday.length}
    ];
    body.innerHTML = rows.map(function(r){
      return '<div class="mini-row"><span class="t">'+r.ic+' '+escapeHtml(r.label)+'</span><span>'+escapeHtml(String(r.val))+'</span></div>';
    }).join("");
  }

  function maybeAskNotifPermission(){
    if(!window.Notification) return;
    if(Notification.permission==="default"){

    }
  }
  document.getElementById("notifAllowBtn").addEventListener("click", function(){

  });

  function fireReminder(item, occDate){
    var title = (item.kind==="appt"?"📅 ":"✅ ") + item.title;
    var bodyText = (item.time||"") + (item.desc? " — "+item.desc : "");
    try{
      if(window.Notification && Notification.permission==="granted"){
        new Notification(title, { body: bodyText, tag: item.id });
      }
    }catch(e){}
  }
  function checkReminders(){
    if(!state.agenda || state.agenda.length===0) return;
    var now = new Date();
    var changed = false;
    state.agenda.forEach(function(item){
      if(item.reminder==="none" || !item.time) return;
      var occ = nextOccurrence(item);
      if(!occ) return;
      var occKey = item.id+"|"+toDateKeyD(occ);
      if(state.agendaNotified[occKey]) return;
      var tp = item.time.split(":");
      var occDateTime = new Date(occ.getFullYear(), occ.getMonth(), occ.getDate(), parseInt(tp[0],10)||0, parseInt(tp[1],10)||0);
      var remindAt = new Date(occDateTime.getTime() - (parseInt(item.reminder,10)||0)*60000);
      if(now>=remindAt && now<=occDateTime){
        fireReminder(item, occ);
        state.agendaNotified[occKey] = true;
        changed = true;
      }
    });
    if(changed) saveState();
    renderTodayAgendaSummary();
  }
  var reminderIntervalStarted = false;
  function startReminderPolling(){
    if(reminderIntervalStarted) return;
    reminderIntervalStarted = true;
    checkReminders();
    setInterval(checkReminders, 30000);
  }

      if(!onboardData.pledgeAccepted){ err.textContent = t("ob_pledge_need"); return; }

    state.habits = onboardData.habits.map(function(h){ return {id:uid(), text:h.text, type:h.type}; });
    state.wakeTime = onboardData.wakeTime;

    state.schedule = onboardData.schedule.map(function(s){ return {id:uid(), label:s.label, time:s.time}; });

    state.pledge = onboardData.pledgeAccepted ? { accepted:true, date: new Date().toLocaleDateString(lang==="ar"?"ar-SA":"en-US") } : null;
    state.onboarded = true;
    saveState();
    enterApp();

  }

  async function handleAuthSubmit2(){
    authEls2.error.textContent = "";
    var id = authEls2.idInput.value.trim();
    var pass = authEls2.passInput.value;
    if(!id || !pass){ authEls2.error.textContent = t("auth2_fill_all"); return; }
    if(id.length<4){ authEls2.error.textContent = t("auth2_identifier_short"); return; }
    if(authMode==="signup"){
      if(pass.length<4){ authEls2.error.textContent = t("auth2_password_short"); return; }
      if(!authEls2.privacyCheck.checked){ authEls2.error.textContent = t("auth2_privacy_need"); return; }
      if(getAccount(id)){ authEls2.error.textContent = t("auth2_exists"); return; }
      authEls2.submit.disabled = true;
      var salt = randomSaltHex();
      var hash = await sha256Hex(pass+salt);
      setAccount(id, { hash:hash, salt:salt, createdAt:Date.now() });
      setSession(id);
      authEls2.submit.disabled = false;
      await afterAuthSuccess(id);
    } else {
      var acc = getAccount(id);
      if(!acc){ authEls2.error.textContent = t("auth2_no_account"); return; }
      var attempts = getAttempts(id);
      if(attempts.lockUntil && Date.now()<attempts.lockUntil){
        authEls2.error.textContent = t("auth2_locked")+" ("+Math.ceil((attempts.lockUntil-Date.now())/1000)+"s)";
        return;
      }
      authEls2.submit.disabled = true;
      var hash2 = await sha256Hex(pass+acc.salt);
      authEls2.submit.disabled = false;
      if(hash2===acc.hash){
        setAttempts(id, {count:0, lockUntil:0});
        setSession(id);
        await afterAuthSuccess(id);
      } else {
        var a = getAttempts(id);
        a.count = (a.count||0)+1;
        if(a.count>=5){ a.lockUntil = Date.now()+60000; a.count=0; authEls2.error.textContent = t("auth2_locked"); }
        else { authEls2.error.textContent = t("auth2_wrong"); }
        setAttempts(id, a);
      }
    }
  }

  function heuristicClassify(lines){
    var urgentWordsAr=["اختبار","تسليم","موعد","واجب","اليوم"], urgentWordsEn=["exam","deadline","due","today","submit"];
    var extraWordsAr=["ترفيه","لعب","أفلام"], extraWordsEn=["fun","play","movie","relax"];
    var uw = lang==="ar"?urgentWordsAr:urgentWordsEn, ew = lang==="ar"?extraWordsAr:extraWordsEn;
    return lines.map(function(l){
      var tier="important";
      if(uw.some(function(w){return l.indexOf(w)>-1;})) tier="urgent";
      else if(ew.some(function(w){return l.indexOf(w)>-1;})) tier="extra";
      return {text:l, tier:tier, reason:""};
    });
  }

  function linkedHabitsFor(skillId){ return state.habits.filter(function(h){ return h.skillId===skillId; }); }
  function linkedTasksFor(skillId){ return state.agenda.filter(function(i){ return i.kind==="task" && i.skillId===skillId; }); }
  function skillNeglected(skillId){
    var linked = linkedHabitsFor(skillId);
    if(linked.length===0) return false;
    for(var d=0; d<3; d++){
      for(var i=0;i<linked.length;i++){ if(isHabitDoneOn(linked[i].id, dateKeyOffset(d))) return false; }
    }
    return true;
  }
  function skillTagHtml(skillId){
    if(!skillId) return "";
    var sk = state.skills.filter(function(s){return s.id===skillId;})[0];
    if(!sk) return "";
    return '<span class="skill-tag">'+t("linked_skill_prefix")+' '+escapeHtml(sk.name)+'</span>';
  }
  function bumpSkillFromHabit(skillId, delta){
    var sk = state.skills.filter(function(s){return s.id===skillId;})[0];
    if(!sk) return;
    sk.current = Math.max(0, Math.min(sk.target, sk.current+delta));
    sk.sessions = Math.max(0, (sk.sessions||0)+delta);
  }
  function bumpSkillFromTask(skillId, delta){
    var sk = state.skills.filter(function(s){return s.id===skillId;})[0];
    if(!sk) return;
    sk.sessions = Math.max(0, (sk.sessions||0)+delta);
  }

  function miniRingSvg(pct, size, strokeW){
    size = size||44; strokeW = strokeW||5;
    var r = (size/2) - strokeW;
    var c = 2*Math.PI*r;
    var offset = c - (c*Math.max(0,Math.min(100,pct))/100);
    return '<svg viewBox="0 0 '+size+' '+size+'" class="mini-ring-svg" style="width:'+size+'px;height:'+size+'px;">'+
      '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" class="mini-ring-track" stroke-width="'+strokeW+'"></circle>'+
      '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" class="mini-ring-fill" stroke-width="'+strokeW+'" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+offset.toFixed(1)+'"></circle>'+
      '</svg>';
  }
  function sessionDotsHtml(sessions){
    var track = Math.max(5, Math.min(sessions,7));
    var html = '<div class="session-dots">';
    for(var i=0;i<track;i++){ html += '<span class="s-dot'+(i<sessions?' filled':'')+'"></span>'; }
    html += '</div>';
    if(sessions>7) html += '<span class="s-extra">+'+(sessions-7)+'</span>';
    return html;
  }
  function weekDotsHtml(habitId){
    var html = '<div class="week-dots">';
    for(var i=6;i>=0;i--){
      var done = isHabitDoneOn(habitId, dateKeyOffset(i));
      var isToday = i===0;
      html += '<span class="w-dot'+(done?' filled':'')+(isToday?' today':'')+'"></span>';
    }
    html += '</div>';
    return html;
  }
  function renderGoals(){
    document.getElementById("goalsCount").textContent = state.goals.length;
    document.getElementById("skillsCount").textContent = state.skills.length;
    document.getElementById("habitsCount").textContent = state.habits.length;
    populateSkillSelect(document.getElementById("newGoalSkill"));
    populateSkillSelect(document.getElementById("newHabitSkill"));

    var gWrap = document.getElementById("goalsListWrap"); gWrap.innerHTML="";
    if(state.goals.length===0){ gWrap.innerHTML = '<p class="empty-hint">'+t("no_goals_yet")+'</p>'; }
    state.goals.forEach(function(g){
      var row=document.createElement("div"); row.className="goal-row-v2";
      row.innerHTML = '<div class="gr-top"><span class="lr-text">'+escapeHtml(g.text)+' '+skillTagHtml(g.skillId)+'</span><button class="lr-del" data-del-goal="'+g.id+'">✕</button></div>'+
        '<div class="gr-bottom">'+sessionDotsHtml(g.sessions)+'<button class="lr-log" data-log-goal="'+g.id+'">'+t("log_session")+'</button></div>';
      gWrap.appendChild(row);
    });
    gWrap.querySelectorAll("[data-log-goal]").forEach(function(b){
      b.addEventListener("click", function(){
        var id=b.getAttribute("data-log-goal");
        var g = state.goals.filter(function(x){return x.id===id;})[0];
        if(g){ g.sessions++; if(g.skillId) bumpSkillFromTask(g.skillId, 1); }
        saveState(); renderGoals();
      });
    });
    gWrap.querySelectorAll("[data-del-goal]").forEach(function(b){
      b.addEventListener("click", function(){
        var id=b.getAttribute("data-del-goal");
        state.goals = state.goals.filter(function(g){ return g.id!==id; });
        saveState(); renderGoals(); renderToday();
      });
    });

    var sWrap = document.getElementById("skillsListWrap"); sWrap.innerHTML="";
    if(state.skills.length===0){ sWrap.innerHTML = '<p class="empty-hint">'+t("no_skills_yet")+'</p>'; }
    state.skills.forEach(function(sk){
      var pct = sk.target>0 ? Math.round((sk.current/sk.target)*100) : 100;
      pct = Math.max(0, Math.min(100, pct));
      var linkedCount = linkedHabitsFor(sk.id).length + linkedTasksFor(sk.id).length;
      var neglected = skillNeglected(sk.id);
      var row=document.createElement("div"); row.className="skill-row-v2";
      row.innerHTML = '<div class="mini-ring-wrap">'+miniRingSvg(pct,48,5)+'<span class="mini-ring-pct">'+pct+'%</span></div>'+
        '<div class="skill-info"><div class="sr-top"><span class="sr-name">'+escapeHtml(sk.name)+'</span><button class="lr-del" data-del-skill="'+sk.id+'">✕</button></div>'+
        '<div class="sr-top"><span class="sr-meta">'+t("skill_level_from_to").replace("{c}",sk.current).replace("{t}",sk.target).replace("{h}",sk.hours)+'</span><button class="sr-bump" data-bump-skill="'+sk.id+'">+</button></div>'+
        (linkedCount>0 ? '<div class="sr-top"><span class="sr-meta">'+t("skill_served_by").replace("{n}",linkedCount)+'</span>'+(neglected?'<span class="neglect-badge">'+t("neglect_badge")+'</span>':'')+'</div>' : '')+
        '</div>';
      sWrap.appendChild(row);
    });
    sWrap.querySelectorAll("[data-bump-skill]").forEach(function(b){
      b.addEventListener("click", function(){
        var id=b.getAttribute("data-bump-skill");
        state.skills.forEach(function(sk){ if(sk.id===id && sk.current<sk.target) sk.current++; });
        saveState(); renderGoals();
      });
    });
    sWrap.querySelectorAll("[data-del-skill]").forEach(function(b){
      b.addEventListener("click", function(){
        var id=b.getAttribute("data-del-skill");
        state.skills = state.skills.filter(function(sk){ return sk.id!==id; });
        state.goals.forEach(function(g){ if(g.skillId===id) g.skillId=null; });
        state.habits.forEach(function(h){ if(h.skillId===id) h.skillId=null; });
        state.agenda.forEach(function(i){ if(i.skillId===id) i.skillId=null; });
        saveState(); renderGoals();
      });
    });

    var hWrap = document.getElementById("habitsListWrap"); hWrap.innerHTML="";
    if(state.habits.length===0){ hWrap.innerHTML = '<p class="empty-hint">'+t("no_habits_yet")+'</p>'; }
    state.habits.forEach(function(h){
      var streak = habitStreak(h.id);
      var row=document.createElement("div"); row.className="habit-row-v2";
      row.innerHTML = '<div class="hr-top"><span class="habit-tag '+h.type+'">'+t("habit_"+h.type)+'</span><span class="lr-text" style="flex:1;">'+escapeHtml(h.text)+' '+skillTagHtml(h.skillId)+'</span>'+
        (streak>0? '<span class="streak-badge">🔥 '+streak+'</span>' : '')+
        '<button class="lr-del" data-del-habit="'+h.id+'">✕</button></div>'+
        '<div class="hr-bottom">'+weekDotsHtml(h.id)+'</div>';
      hWrap.appendChild(row);
    });
    hWrap.querySelectorAll("[data-del-habit]").forEach(function(b){
      b.addEventListener("click", function(){
        var id=b.getAttribute("data-del-habit");
        state.habits = state.habits.filter(function(h){ return h.id!==id; });
        delete state.habitsLog[id];
        saveState(); renderGoals(); renderReviewChecklist(); renderToday();
      });
    });
  }
  document.getElementById("addGoalBtn").addEventListener("click", function(){
    var inp=document.getElementById("newGoalInput"); var v=inp.value.trim();
    if(!v) return;
    var skillId = document.getElementById("newGoalSkill").value || null;
    state.goals.push({id:uid(), text:v, sessions:0, skillId:skillId});
    saveState(); inp.value=""; renderGoals(); renderToday();
  });
  document.getElementById("newGoalInput").addEventListener("keydown", function(e){ if(e.key==="Enter") document.getElementById("addGoalBtn").click(); });
  document.getElementById("addSkillBtn").addEventListener("click", function(){
    var inp=document.getElementById("newSkillInput"); var v=inp.value.trim();
    if(!v) return;
    state.skills.push({id:uid(), name:v, current:0, target:10, hours:1, sessions:0});
    saveState(); inp.value=""; renderGoals();
  });
  document.getElementById("newSkillInput").addEventListener("keydown", function(e){ if(e.key==="Enter") document.getElementById("addSkillBtn").click(); });
  document.getElementById("addHabitBtn").addEventListener("click", function(){
    var inp=document.getElementById("newHabitInput"); var v=inp.value.trim();
    if(!v) return;
    var skillId = document.getElementById("newHabitSkill").value || null;
    state.habits.push({id:uid(), text:v, type:"build", skillId:skillId});
    saveState(); inp.value=""; renderGoals(); renderReviewChecklist(); renderToday();
  });
  document.getElementById("newHabitInput").addEventListener("keydown", function(e){ if(e.key==="Enter") document.getElementById("addHabitBtn").click(); });

  /* ================= coach chat ================= */
  var chatHistory = [];
  function addBubble(role, text){
    var win = document.getElementById("chatWindow");
    var row=document.createElement("div"); row.className="bubble-row"+(role==="me"?" me":"");
    var av = role==="me" ? "" : '<div class="mini-avatar">R</div>';
    row.innerHTML = av+'<div class="bubble '+(role==="me"?"me":"coach")+'"></div>';
    var bubbleEl = row.querySelector(".bubble");
    bubbleEl.textContent = text;
    win.appendChild(row);
    win.scrollTop = win.scrollHeight;
    return bubbleEl;
  }
  document.getElementById("chatSend").addEventListener("click", sendChat);
  document.getElementById("chatInput").addEventListener("keydown", function(e){ if(e.key==="Enter") sendChat(); });
  async function sendChat(){
    var input = document.getElementById("chatInput");
    var msg = input.value.trim(); if(!msg) return;
    addBubble("me", msg);
    chatHistory.push({role:"student", content:msg});
    input.value="";
    var personName = state.nickname||state.name||(lang==="ar"?"الطالب":"Them");
    var historyText = chatHistory.slice(-10).map(function(h){ return (h.role==="student"?(lang==="ar"?personName+": ":"Them: "):(lang==="ar"?"رفيق: ":"Rafiq: "))+h.content; }).join("\n");
    var prompt = persona()+(lang==="ar"?"\n\nمحادثة حتى الآن:\n":"\n\nConversation so far:\n")+historyText+(lang==="ar"?"\n\nرد رفيق القادم:":"\n\nRafiq's next reply:");
    var coachBubble = addBubble("coach", "…");
    var win = document.getElementById("chatWindow");
    var reply = await askAI(prompt, function(partial){ coachBubble.textContent = partial; win.scrollTop = win.scrollHeight; }, {cache:false});
    if(!reply){
      reply = lang==="ar" ? "ما قدرت أتواصل بالذكاء الاصطناعي الحين — جرب ترسل رسالتك مرة ثانية بعد شوي." : "Couldn't reach the AI right now — try sending your message again in a moment.";
    }
    coachBubble.textContent = reply;
    win.scrollTop = win.scrollHeight;
    chatHistory.push({role:"coach", content:reply});
  }

  /* ================= nav ================= */
  document.querySelectorAll(".tab-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      var target = btn.getAttribute("data-target");
      document.querySelectorAll(".tab-btn").forEach(function(b){b.classList.remove("active");});
      btn.classList.add("active");
      document.querySelectorAll(".screen").forEach(function(s){ s.classList.toggle("active", s.getAttribute("data-screen")===target); });
    });
  });

  /* ================= language toggle ================= */
  function updateLangButtons(){
    var label = t("lang_switch_to");
    ["langToggle","langToggleAuth","langToggleOnboard"].forEach(function(id){
      var el = document.getElementById(id);
      if(el) el.textContent = label;
    });
  }
  function toggleLang(){
    lang = lang==="ar" ? "en" : "ar";
    document.getElementById("htmlRoot").setAttribute("lang", lang);
    document.getElementById("htmlRoot").setAttribute("dir", lang==="ar"?"rtl":"ltr");
    updateLangButtons();
    if(!document.getElementById("authScreen").classList.contains("hidden")) renderAuthScreen2();
    if(!document.getElementById("onboardScreen").classList.contains("hidden")) renderOnboardStep();
    if(!document.getElementById("appShell").classList.contains("hidden")) renderAll();
  }
  document.getElementById("langToggle").addEventListener("click", toggleLang);
  document.getElementById("langToggleAuth").addEventListener("click", toggleLang);
  document.getElementById("langToggleOnboard").addEventListener("click", toggleLang);

  function renderAll(){
    applyStaticText();
    renderToday();
    renderTasksOutput();
    renderReviewChecklist();
    renderGoals();
    renderAgendaScreen();
    renderTodayAgendaSummary();
  }

  /* ================= init ================= */
  initAuth();
})();
</script>
</body>
